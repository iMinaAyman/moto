function closeAll(){drw.classList.remove('on');srw.classList.remove('on');ov.classList.remove('on');if(lastF&&lastF.focus)lastF.focus()}
function chipsB(){document.getElementById('bs').innerHTML='<button aria-pressed="'+(!bf)+'" data-b="">All brands</button>'+brands.map(function(b){return '<button aria-pressed="'+(bf===b)+'" data-b="'+b+'">'+b+'</button>'}).join('')}
function chipsS(){document.getElementById('ms').innerHTML='<span class="ml">My size</span>'+['S','M','L','XL'].map(function(z){return '<button aria-pressed="'+(mysize===z)+'" data-z="'+z+'">'+z+'</button>'}).join('')}
document.getElementById('ms').addEventListener('click',function(e){var b=e.target.closest('[data-z]');if(!b)return;mysize=mysize===b.dataset.z?'':b.dataset.z;save();chipsS();say(mysize?'Quick add now uses size '+mysize:'Quick add will ask for a size')});
document.getElementById('srt').onclick=function(){sm=(sm+1)%3;this.textContent='Sort: '+['Featured','Price low to high','Price high to low'][sm];draw()};
function draw(){
 var l=[];items.forEach(function(it,ix){if((tf==='all'||it.k===tf)&&(!bf||it.b===bf))l.push([it,ix])});
 if(sm===1)l.sort(function(a,b){return a[0].p-b[0].p});if(sm===2)l.sort(function(a,b){return b[0].p-a[0].p});
 document.getElementById('ttl').textContent=bf||NAMES[tf];
 document.getElementById('n').textContent=l.length+(l.length===1?' piece':' pieces');
 grid.innerHTML=l.length?l.map(function(x){var i=x[0];return '<article class="card"><div class="im '+FAB[i.k]+'" style="background-color:'+i.bg+';color:'+i.fg+'" data-x="'+x[1]+'">'+(NEW[x[1]]?'<span class="nw">New</span>':'')+'<button class="qa" aria-label="Add '+i.n+' to bag">+</button><div class="sz" role="group" aria-label="Choose size">'+['S','M','L','XL'].map(function(s){return '<button data-s="'+s+'">'+s+'</button>'}).join('')+'</div></div><div class="t"><b>'+i.n+'</b><span>'+i.b+' · '+TN[i.k]+'</span><div class="p">EGP '+fmt(i.p)+'</div></div></article>'}).join(''):'<div class="none">Nothing here yet. Try another filter.</div>';
}
chipsB();chipsS();draw();bar();
document.getElementById('tabs').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;tf=b.dataset.k;document.querySelectorAll('#tabs button').forEach(function(x){x.setAttribute('aria-pressed',x===b)});draw()});
document.getElementById('bs').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;bf=b.dataset.b;chipsB();draw()});
grid.addEventListener('click',function(e){
 var q=e.target.closest('.qa');if(q&&mysize){add(+q.closest('.im').dataset.x,mysize);return}if(q){var im=q.closest('.im'),was=im.classList.contains('q');document.querySelectorAll('.im.q').forEach(function(x){x.classList.remove('q')});if(!was)im.classList.add('q');return}
 var s=e.target.closest('[data-s]');if(s){var im2=s.closest('.im');im2.classList.remove('q');add(+im2.dataset.x,s.dataset.s)}});
document.addEventListener('click',function(e){if(!e.target.closest('.im'))document.querySelectorAll('.im.q').forEach(function(x){x.classList.remove('q')})});
bb.addEventListener('click',openD);bb.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();openD()}});
document.getElementById('bo').onclick=openD;document.getElementById('so').onclick=openS;document.getElementById('cd').onclick=function(){try{navigator.clipboard.writeText('WELCOME10')}catch(e){}say('Code WELCOME10 copied. Apply it in your bag.')};
document.getElementById('dx').onclick=closeAll;document.getElementById('sx').onclick=closeAll;ov.onclick=closeAll;
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeAll()});
document.getElementById('dl').addEventListener('click',function(e){var ad=e.target.closest('[data-add]');if(ad){add(+ad.dataset.add,mysize||'M');return}var b=e.target.closest('[data-q]');if(!b)return;var k=+b.dataset.k;bag[k].q+=+b.dataset.q;if(bag[k].q<=0)bag.splice(k,1);bar()});
document.getElementById('pf').addEventListener('submit',function(){var v=document.getElementById('pc').value.trim().toUpperCase(),m=document.getElementById('pm');if(v==='WELCOME10'){applied=true;m.textContent='Code applied. You saved 10%.';m.className='pm ok'}else{applied=false;m.textContent=v?'That code is not valid.':'Enter a code first.';m.className='pm'}dr();save()});
document.getElementById('pu').onclick=function(){document.getElementById('pc').value='WELCOME10';document.getElementById('pf').dispatchEvent(new Event('submit'))};
document.getElementById('ck').onclick=function(){say('Demo only: checkout is not connected yet')};
var SYN={tee:'tshirt tee تيشيرت تيشرت تيشرتات',shirt:'shirt قميص قمصان',hood:'hoodie hood هودي هوديز',sweat:'sweatshirt sweat سويتشيرت سويت'};
var BAR={nike:'نايك نايكي',adidas:'اديداس أديداس',puma:'بوما',zara:'زارا',hm:'اتش اند ام',levis:'ليفايز ليفيس'};
function norm(t){return t.toLowerCase().replace(/تي شيرت/g,'تيشيرت').replace(/سويت شيرت/g,'سويتشيرت').replace(/['’\-&]/g,'').replace(/\s+/g,' ').trim()}
function lev(a,b){var m=a.length,n=b.length,d=[],i,j;for(i=0;i<=m;i++)d[i]=[i];for(j=1;j<=n;j++)d[0][j]=j;for(i=1;i<=m;i++)for(j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n]}
function hay(it){return norm(it.n+' '+it.b+' '+TN[it.k]+' '+SYN[it.k]+' '+(BAR[norm(it.b)]||'')).split(' ')}
function ok(w,t){return w.indexOf(t)>-1||(t.length>=4&&lev(t,w)<=(t.length>=7?2:1))}
function ss(q){var g=document.getElementById('sg'),t=norm(q);
 if(!t){g.innerHTML='<h3>Brands</h3><div class="sc2">'+brands.map(function(b){return '<button data-b="'+b+'">'+b+'</button>'}).join('')+'</div><h3 style="margin-top:26px">Types</h3><div class="sc2">'+['T-Shirt','Shirt','Hoodie','Sweatshirt'].map(function(b){return '<button data-b="'+b+'">'+b+'</button>'}).join('')+'</div><h3 style="margin-top:26px">Try</h3><div class="sc2"><button data-b="under 1000">Under 1000</button><button data-b="هودي">هودي</button><button data-b="تيشيرت نايك">تيشيرت نايك</button></div>';return}
 var maxP=0,m=t.match(/(under|below|less than|max|اقل من|أقل من|تحت)\s*(\d+)/);if(m){maxP=+m[2];t=t.replace(m[0],'').trim()}
 var toks=t.split(' ').filter(Boolean),l=[];
 items.forEach(function(it,ix){if(maxP&&it.p>maxP)return;var h=hay(it);if(toks.every(function(k){return h.some(function(w){return ok(w,k)})}))l.push([it,ix])});
 g.innerHTML=l.length?'<h3>'+l.length+(l.length===1?' result':' results')+(maxP?' · under EGP '+fmt(maxP):'')+'</h3>'+l.map(function(x){return '<div class="sr"><i class="bd" style="background:'+x[0].bg+'"></i><div class="bn"><b>'+x[0].n+'</b><span>'+x[0].b+' · '+TN[x[0].k]+' · EGP '+fmt(x[0].p)+'</span></div><button class="ad" data-x="'+x[1]+'" aria-label="Add size '+(mysize||'M')+' to bag">+</button></div>'}).join(''):'<p class="em">No results for “'+q.replace(/</g,'&lt;')+'”.<br>Try a brand, a type, or “under 1000”.</p>'}
si.addEventListener('input',function(){ss(si.value)});
document.getElementById('sg').addEventListener('click',function(e){var c=e.target.closest('[data-b]');if(c){si.value=c.dataset.b;ss(si.value);si.focus();return}var a=e.target.closest('.ad');if(a&&!a.classList.contains('on')){a.classList.add('on');a.textContent='✓';add(+a.dataset.x,mysize||'M')}});
toast.addEventListener('click',function(e){if(e.target.id!=='un'||!lastAdd)return;var k=bag.findIndex(function(b){return b.i===lastAdd[0]&&b.s===lastAdd[1]});if(k>-1){bag[k].q--;if(bag[k].q<=0)bag.splice(k,1)}lastAdd=null;bar();toast.classList.remove('on')});
document.getElementById('theme').onclick=function(){var r=document.documentElement;r.dataset.theme=r.dataset.theme==='dark'?'light':'dark'};
addEventListener('scroll',function(){document.getElementById('hd').classList.toggle('sc',scrollY>8)},{passive:true});

document.querySelectorAll('.gm').forEach(function(b){b.onclick=function(e){var br=e.target.closest&&e.target.closest('[data-b]');if(br){bf=br.getAttribute('data-b');chipsB()}tf=b.dataset.k;document.querySelectorAll('#tabs button').forEach(function(x){x.setAttribute('aria-pressed',x.dataset.k===tf)});draw();document.getElementById('shop').scrollIntoView()}});
</script>
</body>
